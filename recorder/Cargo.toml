[package]
name = "recorder"
version = "0.1.0"
edition = "2024"
description = "Mouse gesture recorder"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
enigo = "0.6"
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
