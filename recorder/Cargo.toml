[package]
name = "recorder"
version = "0.1.0"
edition = "2024"
description = "Record mouse movements."

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
chrono = "0.4"
