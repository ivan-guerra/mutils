[package]
name = "recorder"
version = "0.2.0"
edition = "2024"
description = "Mouse gesture recorder"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
enigo = "0.6"
log = "0.4"
postcard = { version = "1.1", features = ["alloc"] }
simplelog = "0.12"
segments = { path = "../segments" }
